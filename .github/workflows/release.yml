name: Release

# Publishes every workspace package whose version is not yet on npm when a
# `v<version>` tag is pushed. The tag must equal the lockstep framework
# version (`node scripts/set-version.mjs --print`); `@mahiframework/datetime` is
# versioned independently and is published whenever its own version is new.
#
# Authentication is npm trusted publishing (OIDC): every package names this
# repository and `release.yml` as its trusted publisher, so the runner mints a
# short-lived credential from the `id-token` below. There is no npm token.
#
# A NEW package cannot be released by this workflow until it exists on the
# registry: there is nothing for a trusted-publisher config to attach to, so
# npm answers the publish with a 404. Publish it once by hand
# (`pnpm publish --access public --no-git-checks` from its directory, using
# pnpm so `workspace:*` deps are rewritten), add this repo and `release.yml`
# as its trusted publisher, then tag. The `publish:check` step below enforces
# this before anything is written.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # mints the OIDC token npm publishes with, and signs provenance

# No `CI_STRICT_MODE` here: this job starts no services, so the database and
# Redis integration suites self-skip, exactly like the service-free CI job.
# They are gated by the `integration` job in ci.yml before a tag is cut.

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `pnpm publish` shells out to the system npm, so npm's version — not
      # pnpm's — is what gates trusted publishing (OIDC), which needs
      # >= 11.5.1. Node 26 ships npm 11.19.1, so nothing extra is needed;
      # this asserts it rather than trusting the bundled version to stay put.
      - name: npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);if(a<26)throw new Error("node >= 26 required, got "+process.versions.node)'
          npx --yes semver@7 "$(npm --version)" -r ">=11.5.1" >/dev/null \
            || { echo "npm $(npm --version) is too old for trusted publishing (need >= 11.5.1)" >&2; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the lockstep version
        run: |
          set -euo pipefail
          expected="v$(node scripts/set-version.mjs --print)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the lockstep version (${expected})" >&2
            exit 1
          fi

      - name: Package metadata and versions are in sync
        run: |
          pnpm metadata:check
          pnpm version:check

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Test (SQLite)
        run: pnpm test

      - name: Tarballs contain only dist, README, LICENSE
        run: pnpm pack:check

      # Trusted publishing cannot create a package that has never been
      # published, and `pnpm publish -r` is not atomic, so a brand-new package
      # would otherwise publish everything ahead of it and then 404, leaving
      # the registry holding half a version. This refuses before anything is
      # written. See the script for the one-time bootstrap it asks for.
      - name: Every package already exists on the registry
        run: pnpm publish:check

      # `pnpm publish -r` skips packages whose version is already on the
      # registry, so re-running a release (or a datetime-only bump) is safe.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
