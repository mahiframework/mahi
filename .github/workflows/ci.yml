name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The database, Redis and SFTP suites turn an unreachable service into a failure
# rather than a skip, so a broken service cannot report green by testing
# nothing. That is keyed off `CI_STRICT_MODE`, NOT `CI`: GitHub Actions sets
# `CI=true` on every runner, so keying off it made the service-free `check`
# job fail on the very integration suites it is meant to skip. Only the
# `integration` job below — the one that actually starts the services —
# opts in.

jobs:
  # Fast, service-free checks: build, lint, typecheck, metadata hygiene, and
  # the SQLite test suites. This gates the heavier integration job.
  check:
    name: build / lint / typecheck / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm install --frozen-lockfile

      - name: Package metadata and versions are in sync
        run: |
          pnpm metadata:check
          pnpm version:check

      - run: pnpm build

      - name: Tarballs contain only dist, README, LICENSE
        run: pnpm pack:check

      - name: Formatting is clean
        run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      # Without services the integration suites self-skip; this exercises the
      # SQLite-backed majority of the tree.
      - name: Test (SQLite)
        run: pnpm test

  # Full suite against real MySQL 8, Postgres 16, Redis 7, and SFTP, S3 and
  # FTP servers. CI_STRICT_MODE=true turns an unreachable service into a
  # failure.
  integration:
    name: integration (mysql / postgres / redis / sftp / s3 / ftp)
    runs-on: ubuntu-latest
    needs: check
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: mahi_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: mahi_test
        options: >-
          --health-cmd="pg_isready -U postgres -d mahi_test"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
      # The SFTP driver's suite runs against a real SSH server. A service
      # container takes no command, so the account is declared through
      # `SFTP_USERS` rather than as an argument, and `upload` is the
      # writable subdirectory the image creates inside the chrooted home.
      sftp:
        image: atmoz/sftp:alpine
        ports:
          # Quoted: unquoted `2222:22` is YAML sexagesimal and parses as the
          # integer 133342, so the mapping silently published a port nothing
          # was listening on and the suite skipped itself.
          - "2222:22"
        env:
          SFTP_USERS: "mahi:mahi:1000:100:upload"
        options: >-
          --health-cmd="nc -z 127.0.0.1 22"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
      # The S3 driver's suite runs against a real S3 server. Published on
      # 9400 to match `docker-compose.yml`, which avoids 9000 because
      # php-fpm claims it on developer machines. The bucket is created by a
      # step below rather than here, since a service container cannot
      # depend on another one having finished.
      s3:
        image: rustfs/rustfs:1.0.0
        ports:
          - 9400:9000
        env:
          RUSTFS_ACCESS_KEY: mahi
          RUSTFS_SECRET_KEY: mahi-secret
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
        options: >-
          --health-cmd="curl -f http://127.0.0.1:9000/health/ready || exit 1"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
      # The FTP driver's suite runs against a real FTP server. The passive
      # port range has to be published or every data transfer hangs, and
      # ADDRESS must be the address the *client* reaches, since the server
      # advertises it in its PASV reply. The password is long because the
      # image's `adduser` rejects a weak one and still starts, leaving an
      # account that only fails at login.
      ftp:
        image: delfer/alpine-ftp-server
        ports:
          # Quoted: unquoted `2121:21` is YAML sexagesimal and parses as the
          # integer 127281, which would publish a port nobody is listening on.
          - "2121:21"
          - "30000-30009:30000-30009"
        env:
          USERS: "mahi|mahipass123"
          ADDRESS: 127.0.0.1
          MIN_PORT: 30000
          MAX_PORT: 30009
        options: >-
          --health-cmd="nc -z 127.0.0.1 21"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      # The driver creates objects, never buckets, so the bucket has to
      # exist before the suite runs. `--aws-sigv4` is curl's own request
      # signing, which avoids installing a CLI just for this.
      - name: Create the S3 test bucket
        run: |
          curl -fsS --aws-sigv4 'aws:amz:us-east-1:s3' -u mahi:mahi-secret \
            -X PUT http://127.0.0.1:9400/mahi-test

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Test (with services)
        run: pnpm test
        env:
          # Only here: every engine above is a declared service, so an
          # unreachable one is a real failure rather than a skip.
          CI_STRICT_MODE: "true"

  # Scaffold an app from the built create-mahi and prove it installs, builds,
  # and boots against the published dist — the thing consumers actually get.
  scaffold-smoke:
    name: create-mahi dist smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Scaffold into `.tmp-scaffold/*`, which is in the pnpm workspace glob,
      # so `--link-workspace`'s `workspace:*` deps resolve against the local
      # framework packages. Install from the repo root, then build the app.
      #
      # NOTE: because this installs into the workspace, an `@mahiframework/*` the
      # template imports but does not DECLARE still resolves here by
      # hoisting — so this step cannot catch a missing dependency, which
      # is a `TS2307` on a real `npm create mahi`. That case is covered
      # statically by create-mahi's "template dependency completeness"
      # test instead. This step's job is that the template compiles.
      - name: Scaffold and build a fresh app
        run: |
          set -euo pipefail
          rm -rf .tmp-scaffold/smoke
          node framework/create-mahi/dist/index.js .tmp-scaffold/smoke --link-workspace --no-install --no-git --yes
          # The scaffold is a NEW workspace member that by definition is not
          # in the committed lockfile, and pnpm defaults `--frozen-lockfile`
          # to true under CI — so this install has to opt out explicitly.
          pnpm install --no-frozen-lockfile
          pnpm --dir .tmp-scaffold/smoke build
