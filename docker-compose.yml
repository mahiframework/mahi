# Backing services for the integration test suites.
#
#   pnpm services:up        # or: docker compose up -d --wait
#   pnpm test:integration
#
# The SQLite suites need none of this and run on their own. These exist
# for the tests that must exercise a real engine — chiefly
# `framework/database/tests/drivers/`, which runs the model and query
# layer against all three dialects,
# `framework/testing/tests/engines.integration.test.ts`, which boots a
# test application on each engine, `framework/redis/tests/`, whose
# subject is cross-process atomicity and pub/sub fanout (things no
# in-memory substitute reproduces), and
# `framework/storage-sftp/tests/`, whose subject is a real SSH server's
# behaviour.
#
# When these are NOT running, those suites skip themselves, so `pnpm
# test` stays green on a machine without docker. `pnpm test:integration`
# sets `CI_STRICT_MODE=true`, which turns an unreachable database into a failure
# instead — a silent skip in an automated run would report green while
# testing nothing.
#
# Everything binds to localhost on the engines' default ports with
# throwaway credentials; nothing here is meant to outlive a test run, so
# there are no volumes and `docker compose down` leaves no state.

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: mahi_test
    # The tests connect the moment the port accepts, which is earlier
    # than MySQL is actually ready to serve; the healthcheck is what
    # `--wait` and CI's service gate block on.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: mahi_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mahi_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The SFTP driver's contract suite runs against a real SSH server:
  # atomic-replace-via-`posix-rename`, a `readdir` walk, reconnect after a
  # dropped session and "rename refuses an existing target" are all
  # properties of the *server*, and a mock would only assert that the
  # driver calls the functions the mock was written around.
  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    # user:password:uid:gid:dir. The account is chrooted to its home,
    # which sshd requires to be root-owned, so the home itself is not
    # writable and the trailing `upload` names the writable subdirectory
    # the image creates and chowns. The tests root their disks in there,
    # and see it as `/upload` since the chroot is their filesystem root.
    environment:
      SFTP_USERS: "mahi:mahi:1000:100:upload"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # No persistence. Nothing here outlives a test run, and an RDB
    # fork-to-disk partway through a suite is pure latency.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
